name: nurbanhoney
description: A new Flutter project.
version: 1.0.2+5
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  authentication_service:
    path: application/authentication_service
  authentication_domain:
    path: domain/authentication_domain
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.0.2
  cupertino_icons: ^1.0.2
  navigation_domain:
    path: domain/navigation_domain
  navigation_service:
    path: application/navigation_service
  preference_storage_service:
    path: application/preference_storage_service
  preference_storage:
    path: data/preference_storage
  dio: ^5.7.0
  dio_domain:
    path: domain/dio_domain
  dio_service:
    path: application/dio_service
  dio_repository:
    path: data/dio_repository
  share_service:
    path: application/share_service
  kakao_flutter_sdk: ^1.9.6
  kakao_flutter_sdk_user: ^1.9.6
  cached_network_image: ^3.2.3
  image_picker: ^1.0.4
  flutter_image_compress: ^2.3.0
  uuid: ^4.0.0
  google_mobile_ads: ^6.0.0
  android_id: ^0.4.0
  intl: ^0.19.0
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0
  json_serializable: ^6.8.0
  http: ^1.2.2
  retrofit: ^4.4.1
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  google_sign_in: ^7.2.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  build_runner:
  flutter_gen_runner:

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/login/
  fonts:
    - family: Pretendard
      fonts:
        - asset: fonts/Pretendard-Regular.otf
          weight: 400
        - asset: fonts/Pretendard-Medium.otf
          weight: 500
        - asset: fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: fonts/Pretendard-Bold.otf
          weight: 700

flutter_gen:
  line_length: 80
  assets:
    outputs:
      package_parameter_enabled: false
  fonts:
    enabled: false