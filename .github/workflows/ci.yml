name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # 로컬 개발 SDK 와 같은 버전을 쓴다. 로컬 Flutter 를 올리면 여기도 함께 올린다.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Stub gitignored secrets
        run: bash tool/ci/stub_secrets.sh

      # 로컬 pre-commit 과 같은 게이트를 전체 모드로 실행한다(변경 파일만 고르지 않는다).
      - name: Commit gate
        run: bash tool/commit_gate.sh
